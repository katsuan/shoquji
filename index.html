<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しょくじ｜食べたものを、さっと記録</title>
<meta name="description" content="しょくじ（ShoQuji）。食べたものとカロリー・PFC をさっと記録して、1日の合計や1週間のふりかえりを見られます。記録はこの端末の中だけ。LINE にカードで送れます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="しょくじ（ShoQuji）">
<meta property="og:title" content="しょくじ｜食べたものを、さっと記録">
<meta property="og:description" content="食べたものをさっと記録。1日の合計・1週間のふりかえり。記録はこの端末の中だけで、LINE にカードで送れます。">
<meta property="og:url" content="https://katsuan.github.io/shoquji/">
<meta property="og:image" content="https://katsuan.github.io/shoquji/ogp.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="しょくじ（ShoQuji）：食べたものを、さっと記録">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff7e8">
<!-- 確認がすむまで、検索に出さない（公開するときに外す） -->
<meta name="robots" content="noindex, nofollow">
<!-- アイコン・ロゴ・OGP は tools/icon.py で作る -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<main class="wrap">
  <!-- 見出しの行：アイコン＋名前（左）と横長のロゴ（右）。ほかの Q のツールと同じ形 -->
  <header class="brand">
    <h1 class="brand-name"><img class="brand-icon" src="icon.svg" alt="" width="30" height="30">しょくじ</h1>
    <img class="brand-logo" src="logo.svg" alt="ShoQuji" width="85" height="28">
  </header>
  <p class="brand-copy">食べたら、ぱっと残そう</p>

  <!-- 日付：きょう・きのう・ほかの日。記録する日と、下の「この日のしょくじ」の日は同じ -->
  <nav class="days" aria-label="日付">
    <button class="chip" type="button" data-day="0">きょう</button>
    <button class="chip" type="button" data-day="-1">きのう</button>
    <label class="chip date-pick"><span id="pickLabel">📅 日付</span><input id="datePick" type="date" aria-label="ほかの日"></label>
  </nav>

  <!-- 記録する -->
  <section class="card" aria-labelledby="formTitle">
    <h2 id="formTitle" class="card-title">📝 <span id="formHeading">記録する</span></h2>
    <div class="meals" role="radiogroup" aria-label="いつ食べた？"></div>
    <label class="field">
      <span class="label">食べたもの</span>
      <input id="name" maxlength="40" placeholder="例：カレーライス" autocomplete="off" enterkeyhint="done">
    </label>
    <!-- 食べたことのあるものは、押すとカロリー・PFC も入る（入れた文字で絞りこむ） -->
    <div id="suggest" class="suggest" aria-label="よく食べるもの"></div>
    <details id="nutri" class="nutri">
      <summary>栄養も入れる <small>（入れなくても記録できます）</small></summary>
      <div class="nutri-grid">
        <label class="field"><span class="label">カロリー</span><span class="unit-input"><input id="kcal" inputmode="decimal" placeholder="0"><i>kcal</i></span></label>
        <label class="field"><span class="label">たんぱく質</span><span class="unit-input"><input id="p" inputmode="decimal" placeholder="0"><i>g</i></span></label>
        <label class="field"><span class="label">脂質</span><span class="unit-input"><input id="f" inputmode="decimal" placeholder="0"><i>g</i></span></label>
        <label class="field"><span class="label">炭水化物</span><span class="unit-input"><input id="c" inputmode="decimal" placeholder="0"><i>g</i></span></label>
      </div>
    </details>
    <div class="form-actions">
      <button id="saveBtn" class="btn primary" type="button">＋ 記録する</button>
      <button id="cancelEdit" class="btn ghost" type="button" hidden>やめる</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </section>

  <!-- この日のしょくじ：合計と目標、食事ごとの一覧（押すと直せる）、LINE で送る -->
  <section class="card" aria-labelledby="dayTitle">
    <h2 id="dayTitle" class="card-title">🍽 <span id="dayHeading">きょうのしょくじ</span></h2>
    <div id="totals" class="totals"></div>
    <div id="dayList" class="day-list"></div>
    <a id="sendBtn" class="btn line" href="#">💬 LINEで送る<small>（おくるん）</small></a>
  </section>

  <!-- ふりかえり：1週間・続けて記録した日数・よく食べるもの -->
  <details class="card fold" id="lookback">
    <summary class="card-title">📈 ふりかえり</summary>
    <div id="streak" class="streak"></div>
    <div id="week" class="week" aria-label="1週間のカロリー"></div>
    <div id="ranking" class="ranking"></div>
  </details>

  <!-- 設定：目標・控え（書き出し・読みこみ）・全部消す -->
  <details class="card fold" id="settings">
    <summary class="card-title">⚙️ 目標・記録の控え</summary>
    <p class="hint">1日の目標（ふりかえりのバーの目安）</p>
    <div class="nutri-grid">
      <label class="field"><span class="label">カロリー</span><span class="unit-input"><input id="tKcal" inputmode="decimal"><i>kcal</i></span></label>
      <label class="field"><span class="label">たんぱく質</span><span class="unit-input"><input id="tP" inputmode="decimal"><i>g</i></span></label>
      <label class="field"><span class="label">脂質</span><span class="unit-input"><input id="tF" inputmode="decimal"><i>g</i></span></label>
      <label class="field"><span class="label">炭水化物</span><span class="unit-input"><input id="tC" inputmode="decimal"><i>g</i></span></label>
    </div>
    <p class="hint">🔒 記録はこの端末（ブラウザ）の中だけにあります。機種変更やブラウザのデータを消す前に、控えを書き出しておいてください。</p>
    <div class="form-actions">
      <button id="exportBtn" class="btn ghost" type="button">⬇️ 控えを書き出す</button>
      <label class="btn ghost file-btn">⬆️ 控えを読みこむ<input id="importFile" type="file" accept="application/json,.json"></label>
    </div>
    <button id="resetBtn" class="link danger" type="button">記録をすべて消す</button>
  </details>

  <!-- 「📤 しょくじを紹介する」：おくるんで紹介カードを送る窓口（line-share/shared/tool-share.js。中身は line-share/data/hub-links.json） -->
  <div data-tool-share></div>
</main>

<!-- おくるんのカードの入口（LIFF ID とカードの URL は line-share の shared/oqrn.js に1か所） -->
<script src="https://katsuan.github.io/line-share/shared/oqrn.js"></script>
<script type="module" src="app.js?v=1"></script>
<script src="https://katsuan.github.io/line-share/shared/tool-share.js" data-tool="shoquji" defer></script>
</body>
</html>
